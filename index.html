<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nimble – Membership Registration</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--g:#0b3d2e;--g2:#14664b;--n:#12264a;--bg:#f6f8f7;--card:#fff;--tx:#14211c;--mu:#5b6b64;--bd:#d9e2de;--ac:#ffa62b;--er:#b3261e;--ok:#17703f;--wa:#9a6700;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1512;--card:#13211c;--tx:#e8f0ec;--mu:#9bb0a7;--bd:#25382f;--g:#0a2f23;--er:#ff8a80;--ok:#6fdc9f;--wa:#f0c05a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:var(--g);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--ac);display:inline-block;border:3px solid #fff}
nav a.l{color:#dfeee7;text-decoration:none;font-size:.92rem;margin-left:auto}nav a.l+a.l{margin-left:0}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,var(--g),var(--n));color:#fff;border-radius:16px;padding:48px 24px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.8rem)}.hero p{max-width:560px;margin:0 auto 20px;color:#d8e8e1}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--ac);color:#10200a;font-size:1rem;text-decoration:none}
.btn.s{background:var(--g2);color:#fff}.btn.d{background:var(--er);color:#fff}.btn.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:.85rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;color:var(--g2)}h2{color:var(--g2);margin:28px 0 8px}
.fee{font-size:2.2rem;font-weight:800;color:var(--g2)}
form .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}label .r{color:var(--er)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-weight:400}.chk input{width:auto;margin-top:5px}
.err{color:var(--er);font-size:.88rem;margin:8px 0}.note{background:var(--bg);border:1px dashed var(--bd);padding:10px;border-radius:8px;font-size:.88rem;color:var(--mu)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid currentColor}
.t-Paid{color:var(--ok)}.t-Rejected{color:var(--er)}.t-Pending{color:var(--wa)}.t-Awaiting{color:var(--n)}
@media(prefers-color-scheme:dark){.t-Awaiting{color:#8fb4ff}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.stat b{display:block;font-size:1.5rem;color:var(--g2)}
.pay{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}#qr{background:#fff;padding:12px;display:inline-block;border-radius:10px}
.member{border:3px double var(--g2);border-radius:14px;padding:26px;text-align:center;background:var(--card)}
.member .no{font-size:1.6rem;font-weight:800;color:var(--g2);letter-spacing:1px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}img.th{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--bd)}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:20px}
@media print{body.pr .member,body.pm .rcp,body.pr .lc,body.pm .lc{display:none!important}header,footer,.np{display:none!important}body{background:#fff;color:#000}}
[hidden]{display:none!important}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.igt{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--g2),var(--n));color:#fff;display:flex;align-items:flex-end;padding:8px;font-size:.8rem;font-weight:700;text-decoration:none}
#intro{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#14664b,#0b3d2e 55%,#12264a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;transition:opacity .7s;text-align:center;padding:20px}
#intro.out{opacity:0;pointer-events:none}
.stg{position:relative;width:min(340px,86vw);height:170px;border-bottom:2px solid #ffffff55}
.rk{position:absolute;bottom:0;width:54px;height:96px;transform-origin:50% 90%}
.rk.l{left:0;animation:swl 2.2s ease-in-out infinite}.rk.r{right:0;animation:swr 2.2s ease-in-out infinite 1.1s}
@keyframes swl{0%{transform:rotate(25deg)}5%{transform:rotate(60deg)}18%,100%{transform:rotate(25deg)}}
@keyframes swr{0%{transform:rotate(-25deg)}5%{transform:rotate(-60deg)}18%,100%{transform:rotate(-25deg)}}
.sh{position:absolute;width:26px;height:32px;left:12%;bottom:30%;animation:fx 1.1s linear infinite alternate,fy 1.1s ease-in-out infinite}
.sh svg{width:100%;height:100%;animation:tw 1.1s ease-in-out infinite alternate}
@keyframes fx{from{left:14%}to{left:76%}}@keyframes fy{0%,100%{bottom:30%}50%{bottom:80%}}@keyframes tw{from{transform:rotate(-75deg)}to{transform:rotate(75deg)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#intro h1{margin:8px 0 0;font-size:clamp(1.8rem,7vw,3rem);animation:up .9s .5s both}
@media(prefers-reduced-motion:reduce){.rk,.sh,.sh svg{animation:none}}
.loy{background:linear-gradient(135deg,#2c3d2b,#13241d 60%,#0c1a15);border:1px solid #6b5f3a;border-radius:22px;padding:26px;color:#d8e0d4;max-width:640px;font-family:Jost,system-ui,sans-serif}
.lt{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.1rem;color:#e6c887;margin:0 0 6px}
.ls{color:#a9b8ad;margin:0 0 16px}
.lg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.st{aspect-ratio:1;border-radius:50%;border:1px dashed #6b6a4a;display:flex;align-items:center;justify-content:center;color:#a9b8ad;font-size:1.1rem}
.st.on{border:2px solid #e6c887;background:radial-gradient(circle,#e6c88740,#e6c88710);font-size:1.4rem}
.lr{display:flex;gap:10px;flex-wrap:wrap}.lr input{flex:1 1 180px;background:#0b1511;border:1px solid #3b4a3d;color:#e8f0ec;border-radius:14px;padding:14px;min-width:0}
.gb{border:0;border-radius:999px;padding:0 26px;min-height:48px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:#2b2208;background:linear-gradient(135deg,#f3dc9b,#c9a24f);cursor:pointer;white-space:nowrap}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost&display=swap" rel="stylesheet">

 A.innerHTML=`<h2>Admin dashboard</h2><div class="stats">
 <div class="card stat"><b>${R.length}</b>Registered</div><div class="card stat"><b>${paid.length}</b>Paid members</div>
 <div class="card stat"><b>${c("Awaiting Verification")}</b>Awaiting verification</div><div class="card stat"><b>${c("Rejected")}</b>Rejected</div>
 <div class="card stat"><b>${incomplete}</b>Incomplete (no proof)</div><div class="card stat"><b>${inr(paid.reduce((a,r)=>a+r.total,0))}</b>Collected</div></div>
 <div class="card" style="margin-top:14px"><div class="row2" style="margin:0 0 10px"><input id="q" placeholder="Search name, phone, ID" value="${esc(fq)}" style="max-width:260px">
 <select id="ff" style="max-width:200px">${["All","Pending Payment","Awaiting Verification","Paid","Rejected"].map(s=>`<option ${s===ff?"selected":""}>${s}</option>`).join("")}</select>
 <button class="btn s sm" id="csv">Export CSV</button><button class="btn o sm" id="rem">Send reminders</button><button class="btn o sm" id="out">Log out</button></div>
 <div class="tw"><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Amount</th><th>Status</th><th></th></tr>
 ${list.map(r=>`<tr><td>${r.id}</td><td>${esc(r.name)}</td><td>${esc(r.mobile)}</td><td>${inr(r.total)}</td><td>${tag(r.status)}</td><td><button class="btn sm o" data-v="${r.id}">View</button></td></tr>`).join("")||"<tr><td colspan=6>No registrations.</td></tr>"}</table></div></div>
 <div id="det"></div>${slotEditor()}${formEditor()}
 <div class="grid"><div class="card"><h3>Settings</h3><form id="sf2">
 ${[["club","Club name"],["upi","UPI ID"],["fee","Default fee per person (₹), used for new slots"],["adminEmail","Admin email"],["phone","Phone"],["insta","Instagram handle (no @)"],["followers","Instagram followers (manual number)"],["igApi","Instagram API URL (optional, see setup guide)"],["loyaltyTarget","Loyalty: stamps needed for reward"],["loyaltyReward","Loyalty reward"],["staffPin","Staff PIN (for adding loyalty stamps)"],["addr","Address"]].map(([k,l])=>`<label>${l}</label><input name="${k}" value="${esc(DB.settings[k])}">`).join("")}
 <label>Instagram post/reel links (one per line, up to 6)</label><textarea name="posts" rows="3">${esc(DB.settings.posts||"")}</textarea><label>New admin password (optional)</label><input name="np" type="password"><div class="row2"><button class="btn s sm">Save settings</button></div></form></div>
 <div class="card"><h3>Email log (simulated)</h3><div style="max-height:320px;overflow:auto;font-size:.85rem">${DB.emails.slice(0,30).map(m=>`<p><b>${esc(m.subject)}</b><br>To: ${esc(m.to)} · ${esc(m.at)}<br><span style="white-space:pre-line;color:var(--mu)">${esc(m.body)}</span></p>`).join("")||"No emails yet."}</div></div></div>
 <div class="note">Going live: this prototype keeps data in the browser. For production, add the Node.js/Express + PostgreSQL backend, a transactional email service (SendGrid, Brevo, etc.), server-side validation, hashed passwords, and file storage. The data model and flow here carry over directly; court booking, coaching and WhatsApp can be added as new modules.</div>`;
 $("#q").oninput=e=>{fq=e.target.value;adminView().then(()=>{const q=$("#q");q.focus();q.setSelectionRange(fq.length,fq.length)})};
 $("#ff").onchange=e=>{ff=e.target.value;adminView()};bindEd();
 $("#out").onclick=()=>{admin=false;adminView()};
 $("#csv").onclick=()=>{const h=["id","slot","loc","name","dob","age","gender","mobile","wa","email","addr","exp","prev","time","pref","coach","ecn","ecp","n","total","status","utr","paidAt","memberNo","created","notes"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const t=[h.join(",")].concat(R.map(r=>h.map(k=>q(r[k])).join(","))).join("\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(t);a.download="registrations.csv";a.click()};
 $("#rem").onclick=()=>{let k=0;R.filter(r=>r.remind&&["Pending Payment","Rejected"].includes(r.status)&&r.lastRem!==new Date().toDateString()).forEach(r=>{r.lastRem=new Date().toDateString();mail(r.email,"Reminder: complete your registration",`Hi ${r.name}, your registration ${r.id} is awaiting payment of ${inr(r.total)}.`);k++});save();alert(k+" reminder(s) logged (max one per day each).");adminView()};
 $("#sf2").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);DB.settings.posts=f.get("posts");["club","upi","adminEmail","phone","addr","insta","followers","igApi","loyaltyTarget","loyaltyReward","staffPin"].forEach(k=>DB.settings[k]=f.get(k));DB.settings.fee=Math.max(0,+f.get("fee")||0);
  if(f.get("np")){DB.settings.passHash=await sha(f.get("np"));delete DB.settings.pass}save();alert("Saved");route()};
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{sel=b.dataset.v;detail()});if(sel)detail()}

function detail(){const r=DB.regs.find(x=>x.id===sel);if(!r)return;const D=$("#det");
 const rows=[["Name",r.name],["Slot",r.slot],["Location",r.loc],["DOB / age",r.dob+" / "+r.age],["Gender",r.gender],["Mobile",r.mobile],["WhatsApp",r.wa],["Email",r.email],["Address",r.addr],["Experience",r.exp],["Previous",r.prev],["Time",r.time],["Preference",r.pref],["Coaching",r.coach],["Emergency",r.ecn+" "+r.ecp],["Participants",r.n],["Amount",inr(r.total)],["UTR",r.utr],["Paid at",r.paidAt],["Member no.",r.memberNo],["Receipt no.",r.rcpNo],["Comments",r.com]];
 D.innerHTML=`<div class="card" style="margin-top:14px"><h3>${r.id} ${tag(r.status)}</h3><div class="grid" style="margin:0">
 <div>${rows.concat(Object.entries(r.extra||{})).map(([k,v])=>v?`<div><b>${k}:</b> ${esc(v)}</div>`:"").join("")}</div>
 <div>${r.photo?`<p><img class="th" style="max-height:120px" src="${r.photo}" alt="Photo"></p>`:""}${r.shot?`<img class="th" src="${r.shot}" alt="Payment screenshot">`:"<i>No payment proof yet.</i>"}</div></div>
 <label>Internal admin notes</label><textarea id="nt" rows="2">${esc(r.notes)}</textarea>
 <div class="row2"><button class="btn sm s" id="sn">Save note</button>
 ${r.status==="Awaiting Verification"?`<button class="btn sm" id="ap">Approve (payment verified)</button><button class="btn sm d" id="rj">Reject</button>`:""}
 <button class="btn sm o" id="rs">Resend last email</button><a class="btn sm o" href="tel:${esc(r.mobile)}">Call</a><a class="btn sm o" href="mailto:${esc(r.email)}">Email</a></div>
 <h3 style="margin-top:14px">Audit &amp; tracking</h3><div style="font-size:.85rem;color:var(--mu)">${(r.audit||[]).concat((r.events||[]).map(e=>({at:"",text:e.ev}))).map(a=>`${esc(a.at)} ${esc(a.text)}`).join("<br>")}</div></div>`;
 $("#sn").onclick=()=>{r.notes=$("#nt").value;log(r,"Admin note updated");save();alert("Saved")};
 const ap=$("#ap");if(ap)ap.onclick=()=>{if(r.status!=="Awaiting Verification")return;if(!confirm("Confirm you have verified the actual payment of "+inr(r.total)+"?"))return;
  r.status="Paid";r.memberNo="MEM-"+new Date().getFullYear()+"-"+String(++DB.msec).padStart(4,"0");r.verifiedAt=now();r.rcpNo="RCP-"+new Date().getFullYear()+"-"+String(DB.rsec=(DB.rsec||0)+1).padStart(4,"0");r.rcpAt=r.verifiedAt;log(r,"Payment APPROVED by admin; "+r.memberNo);track(r,"Payment verified");
  mail(r.email,"Membership confirmed – "+r.memberNo,`Hi ${r.name}, your membership is confirmed.\nMembership no: ${r.memberNo}\nRegistration ID: ${r.id}\nAmount: ${inr(r.total)}\nPayment ref: ${r.utr}\nReceipt no: ${r.rcpNo}\n(View and print your receipt from Check status.)`);
  mail(S().adminEmail,"Payment approved "+r.id,`${r.name} approved. Member ${r.memberNo}.`);save();adminView()};
 const rj=$("#rj");if(rj)rj.onclick=()=>{const why=prompt("Reason for rejection (shown to applicant):","");if(why===null)return;r.status="Rejected";r.reason=why;log(r,"Payment REJECTED: "+why);
  mail(r.email,"Payment verification unsuccessful",`Hi ${r.name}, we could not verify your payment for ${r.id}. ${why}\nPlease resubmit your payment details at the payment page.`);save();adminView()};
 $("#rs").onclick=()=>{const m=DB.emails.find(m=>m.body.includes(r.id)||m.to===r.email);if(m){mail(m.to,m.subject+" (resent)",m.body);log(r,"Email resent");alert("Resent (logged)");adminView()}else alert("No email found")};}

(()=>{const i=$("#intro");$("#ilogo").src=LOGO;const done=()=>{if(!i.isConnected)return;i.classList.add("out");setTimeout(()=>i.remove(),750)};$("#skip").onclick=done;setTimeout(done,4500)})();
route();
</script>
</body>
</html>
